# Root task runner. Units keep their own tooling; the tasks below are thin
# entry points into them. Call sub-tasks through {{.TASK_EXE}}.

version: "3"

includes:
  api:
    taskfile: ./services/api/Taskfile.yml
    dir: ./services/api
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web
  server:
    taskfile: ./infra/dev/server/Taskfile.yml
    dir: .

vars:
  # Every port a dev task listens on. Keep in sync with the table in CLAUDE.md.
  # Container ports (Postgres, proxy) stay out: see CLAUDE.md.
  DEV_PORTS: "4910 4930"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - "{{.TASK_EXE}} --list"

  install:
    desc: Install the Bun workspace's dependencies (apps/* and packages/*) at the root
    sources: [package.json, bun.lock, apps/*/package.json, packages/*/package.json]
    cmds:
      - bun install

  down:
    desc: Stop every dev server this repo started
    silent: true
    cmds:
      - ./infra/dev/down.sh {{.DEV_PORTS}}

  db:up:
    desc: Start the dev Postgres (Podman) and wait until it accepts connections
    cmds:
      - podman compose -f infra/dev/compose.yml up -d
      - until podman compose -f infra/dev/compose.yml exec -T postgres pg_isready -U bakery >/dev/null 2>&1; do sleep 1; done

  db:down:
    desc: Stop the dev Postgres (data is kept in its volume)
    cmds:
      - podman compose -f infra/dev/compose.yml down

  dev:
    desc: Run every unit's dev server together (Ctrl+C stops all)
    cmds:
      - task: db:up
      - task: units

  units:
    internal: true
    deps: [api:dev, web:dev]

  git:up:
    desc: Start the Forgejo stand-in (127.0.0.1:4950 HTTP, :4952 SSH)
    cmds:
      - podman compose -f infra/dev/compose.yml --profile git up -d forgejo

  git:down:
    desc: Stop and remove the Forgejo stand-in and its volumes
    cmds:
      - podman compose -f infra/dev/compose.yml --profile git rm -sf forgejo
      - podman volume rm -f bakery-dev_bakery-forgejo-data bakery-dev_bakery-forgejo-config

  remote:up:
    desc: Start the Remote server stand-in (sshd + rootless Podman, 127.0.0.1:4972, user podman)
    cmds:
      - podman compose -f infra/dev/compose.yml --profile remote up -d --build remote

  remote:down:
    desc: Stop and remove the Remote server stand-in
    cmds:
      - podman compose -f infra/dev/compose.yml --profile remote rm -sf remote

  mail:up:
    desc: Start the Mailpit SMTP stand-in (127.0.0.1:4980 SMTP, http://127.0.0.1:4985 web and API)
    cmds:
      - podman compose -f infra/dev/compose.yml --profile mail up -d mailpit

  mail:down:
    desc: Stop and remove the Mailpit stand-in
    cmds:
      - podman compose -f infra/dev/compose.yml --profile mail rm -sf mailpit

  s3:up:
    desc: Start the Garage S3 stand-in (127.0.0.1:4960) with bucket bakery-backups; key in infra/dev/state/garage.env
    cmds:
      - podman compose -f infra/dev/compose.yml --profile s3 up -d garage
      - ./infra/dev/garage/setup.sh

  s3:down:
    desc: Stop and remove the Garage stand-in and its volumes
    cmds:
      - podman compose -f infra/dev/compose.yml --profile s3 rm -sf garage
      - podman volume rm -f bakery-dev_bakery-garage-meta bakery-dev_bakery-garage-data
      - rm -f infra/dev/state/garage.env

  git:test:
    desc: Private repository, deploy key and webhook end to end against Forgejo (needs task dev)
    cmds:
      - ./infra/dev/git/test.sh

  previews:test:
    desc: Previews of pull requests (deploy, redeploy, comment, fork ignored, close) end to end against Forgejo (needs task dev)
    cmds:
      - ./infra/dev/previews/test.sh

  deploy:test:
    desc: Health check, zero-downtime redeploy, cancel, rollback and variables end to end against Forgejo (needs task dev)
    cmds:
      - ./infra/dev/deploy/test.sh

  buildpack:test:
    desc: Every build pack end to end against Forgejo and its registry (needs task dev)
    cmds:
      - ./infra/dev/buildpack/test.sh

  settings:test:
    desc: Domains, Redirect, headers, basic auth, persistent storage and resource limits end to end against Forgejo (needs task dev)
    cmds:
      - ./infra/dev/settings/test.sh

  access:test:
    desc: Members, Roles, Invitations and API tokens end to end (needs task dev)
    cmds:
      - ./infra/dev/access/test.sh

  guilds:test:
    desc: Guilds keep to themselves end to end (needs task dev)
    cmds:
      - ./infra/dev/guilds/test.sh

  guild-master:test:
    desc: The Guild Master and its Transfer offers end to end (needs task dev)
    cmds:
      - ./infra/dev/guild-master/test.sh

  roles:test:
    desc: Roles and the hierarchy end to end (needs task dev)
    cmds:
      - ./infra/dev/roles/test.sh

  account:test:
    desc: Profile and two-factor authentication end to end (needs task dev)
    cmds:
      - ./infra/dev/account/test.sh

  databases:test:
    desc: Every Database type, internal and public URLs, stop/start and deletion end to end (needs task dev; RESTART_API=1 also restarts it)
    cmds:
      - ./infra/dev/databases/test.sh

  environments:test:
    desc: Environments added, renamed and deleted (refused while they hold Resources), and viewers refused (needs task dev)
    cmds:
      - ./infra/dev/environments/test.sh

  services:test:
    desc: Services from a template and a compose file, through the Proxy, end to end (needs task dev)
    cmds:
      - ./infra/dev/services/test.sh

  servers:test:
    desc: Servers, local and a Remote server over SSH (the stand-in), end to end (needs task dev)
    cmds:
      - ./infra/dev/servers/test.sh

  remote-deploy:test:
    desc: An Application deployed to a Remote server (the stand-in) and served by its own proxy, end to end (needs task dev)
    cmds:
      - ./infra/dev/remote-deploy/test.sh

  backups:test:
    desc: Backup executions of every Database type to local disk and Garage, restore, retention and schedule end to end (needs task dev and task s3:up)
    cmds:
      - ./infra/dev/backups/test.sh

  notifications:test:
    desc: Every Notification channel kind, the events that notify and emailed Invitations end to end (needs task dev and task mail:up; task remote:up adds the Server probe)
    cmds:
      - ./infra/dev/notifications/test.sh

  images:
    desc: Build every image (localhost/bakery-*:dev) from infra/images
    cmds:
      - task: images:api
      - task: images:web

  images:api:
    desc: Build localhost/bakery-api:dev
    cmds:
      - podman build -f infra/images/api/Containerfile -t localhost/bakery-api:dev .

  images:web:
    desc: Build localhost/bakery-web:dev
    cmds:
      - podman build -f infra/images/web/Containerfile -t localhost/bakery-web:dev .

  install:check:
    desc: shellcheck the install script
    cmds:
      - |
        if command -v shellcheck >/dev/null; then shellcheck -x infra/dev/garage/setup.sh infra/install/install.sh infra/dev/git/test.sh infra/dev/deploy/test.sh infra/dev/buildpack/test.sh infra/dev/settings/test.sh infra/dev/access/test.sh infra/dev/guilds/test.sh infra/dev/guild-master/test.sh infra/dev/roles/test.sh infra/dev/account/test.sh infra/dev/databases/test.sh infra/dev/environments/test.sh infra/dev/backups/test.sh infra/dev/services/test.sh infra/dev/servers/test.sh infra/dev/remote-deploy/test.sh infra/dev/notifications/test.sh infra/dev/previews/test.sh infra/dev/server/checks.sh
        else podman run --rm -v .:/mnt:ro,Z -w /mnt docker.io/koalaman/shellcheck-alpine shellcheck -x infra/dev/garage/setup.sh infra/install/install.sh infra/dev/git/test.sh infra/dev/deploy/test.sh infra/dev/buildpack/test.sh infra/dev/settings/test.sh infra/dev/access/test.sh infra/dev/guilds/test.sh infra/dev/guild-master/test.sh infra/dev/roles/test.sh infra/dev/account/test.sh infra/dev/databases/test.sh infra/dev/environments/test.sh infra/dev/backups/test.sh infra/dev/services/test.sh infra/dev/servers/test.sh infra/dev/remote-deploy/test.sh infra/dev/notifications/test.sh infra/dev/previews/test.sh infra/dev/server/checks.sh
        fi

  check:
    desc: Format check, lint, test and type-check every unit
    cmds:
      - task: api:check
      - task: web:check
      - task: install:check
