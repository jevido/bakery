# Root task runner. Units keep their own tooling; the tasks below are thin
# entry points into them. Call sub-tasks through {{.TASK_EXE}}.

version: "3"

includes:
  api:
    taskfile: ./services/api/Taskfile.yml
    dir: ./services/api
  web:
    taskfile: ./apps/web/Taskfile.yml
    dir: ./apps/web
  server:
    taskfile: ./infra/dev/server/Taskfile.yml
    dir: .

vars:
  # Every port a dev task listens on. Keep in sync with the table in CLAUDE.md.
  # Container ports (Postgres, proxy) stay out: see CLAUDE.md.
  DEV_PORTS: "4910 4930"

tasks:
  default:
    desc: List available tasks
    silent: true
    cmds:
      - "{{.TASK_EXE}} --list"

  down:
    desc: Stop every dev server this repo started
    silent: true
    cmds:
      - ./infra/dev/down.sh {{.DEV_PORTS}}

  db:up:
    desc: Start the dev Postgres (Podman) and wait until it accepts connections
    cmds:
      - podman compose -f infra/dev/compose.yml up -d
      - until podman compose -f infra/dev/compose.yml exec -T postgres pg_isready -U bakery >/dev/null 2>&1; do sleep 1; done

  db:down:
    desc: Stop the dev Postgres (data is kept in its volume)
    cmds:
      - podman compose -f infra/dev/compose.yml down

  dev:
    desc: Run every unit's dev server together (Ctrl+C stops all)
    cmds:
      - task: db:up
      - task: units

  units:
    internal: true
    deps: [api:dev, web:dev]

  ralph:
    desc: Unattended loop that plans and builds phases until Coolify parity (.claude/ralph)
    cmds:
      - ./.claude/ralph/ralph.sh

  images:
    desc: Build every image (localhost/bakery-*:dev) from infra/images
    cmds:
      - task: images:api
      - task: images:web

  images:api:
    desc: Build localhost/bakery-api:dev
    cmds:
      - podman build -f infra/images/api/Containerfile -t localhost/bakery-api:dev .

  images:web:
    desc: Build localhost/bakery-web:dev
    cmds:
      - podman build -f infra/images/web/Containerfile -t localhost/bakery-web:dev .

  install:check:
    desc: shellcheck the install script
    cmds:
      - |
        if command -v shellcheck >/dev/null; then shellcheck infra/install/install.sh
        else podman run --rm -v ./infra/install:/mnt:ro,Z docker.io/koalaman/shellcheck-alpine shellcheck /mnt/install.sh
        fi

  check:
    desc: Format check, lint, test and type-check every unit
    cmds:
      - task: api:check
      - task: web:check
      - task: install:check
