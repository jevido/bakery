version: "3"

tasks:
  env:
    desc: Create .env from .env.example with fresh APP_KEY and JWT_SECRET (once)
    status:
      - test -f .env
    cmds:
      - cp .env.example .env
      - go run . artisan key:generate
      - go run . artisan jwt:secret

  tools:
    desc: Download the pinned nixpacks binary into bin/ (once)
    vars:
      # Keep in step with infra/images/api/Containerfile.
      NIXPACKS_VERSION: 1.41.0
      NIXPACKS_SHA256: 0f55de7874507b9cf7502113120bd96f2ab6979f78d10eaf2eb2ade9207b3af6
    status:
      - bin/nixpacks --version | grep -qx 'nixpacks {{.NIXPACKS_VERSION}}'
    cmds:
      - mkdir -p bin
      - curl -fsSL -o bin/nixpacks.tar.gz https://github.com/railwayapp/nixpacks/releases/download/v{{.NIXPACKS_VERSION}}/nixpacks-v{{.NIXPACKS_VERSION}}-x86_64-unknown-linux-musl.tar.gz
      - echo "{{.NIXPACKS_SHA256}}  bin/nixpacks.tar.gz" | sha256sum -c --quiet
      - tar -xzf bin/nixpacks.tar.gz -C bin nixpacks
      - rm bin/nixpacks.tar.gz

  dev:
    desc: Migrate, then run the API on 127.0.0.1:4910
    deps: [env, tools]
    env:
      MIGRATE_ON_START: "true"
    cmds:
      - go run .

  check:
    desc: gofmt, go vet and go test
    cmds:
      - gofmt -l . | (! grep .)
      - go vet ./...
      - go test ./...

  migrate:
    desc: Run database migrations
    deps: [env]
    cmds:
      - go run . artisan migrate

  test:podman:
    desc: Integration tests against the rootless Podman socket (tag podman)
    cmds:
      - go test -tags podman -count=1 ./...

  test:s3:
    desc: S3 client tests against the Garage stand-in (task s3:up first; tag garage)
    cmds:
      - go test -tags garage -count=1 -run Garage ./contexts/databases/infra/
