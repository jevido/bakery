name: Uptime Kuma
description: Self-hosted monitoring for websites, APIs and ports, with status pages and notifications.
docs_url: https://github.com/louislam/uptime-kuma
tags: [monitoring, status page]
compose: |
  services:
    uptime-kuma:
      image: docker.io/louislam/uptime-kuma:1
      environment:
        - SERVICE_FQDN_UPTIME_KUMA_3001
      volumes:
        - uptime-kuma-data:/app/data
