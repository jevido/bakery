# Local backing services. Credentials here are dev-only, not secrets.
name: bakery-dev

services:
  postgres:
    image: docker.io/library/postgres:18
    environment:
      POSTGRES_USER: bakery
      POSTGRES_PASSWORD: bakery
      POSTGRES_DB: bakery
    ports:
      - "127.0.0.1:4920:5432"
    volumes:
      - bakery-db:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "bakery"]
      interval: 2s
      timeout: 3s
      retries: 15

  # Git host stand-in for private repositories and webhooks (task git:up,
  # task git:test). Host networking so Forgejo reaches the dev API on
  # 127.0.0.1:4910 for webhooks, as a git host on the internet reaches a
  # server; it listens on 127.0.0.1:4950 (HTTP) and 127.0.0.1:4952 (SSH).
  forgejo:
    image: codeberg.org/forgejo/forgejo:16-rootless
    profiles: [git]
    network_mode: host
    environment:
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__HTTP_ADDR: 127.0.0.1
      FORGEJO__server__HTTP_PORT: "4950"
      FORGEJO__server__ROOT_URL: http://127.0.0.1:4950/
      FORGEJO__server__DOMAIN: 127.0.0.1
      FORGEJO__server__SSH_DOMAIN: 127.0.0.1
      FORGEJO__server__START_SSH_SERVER: "true"
      FORGEJO__server__SSH_LISTEN_HOST: 127.0.0.1
      FORGEJO__server__SSH_LISTEN_PORT: "4952"
      FORGEJO__server__SSH_PORT: "4952"
      FORGEJO__database__DB_TYPE: sqlite3
      FORGEJO__webhook__ALLOWED_HOST_LIST: loopback
      FORGEJO__service__DISABLE_REGISTRATION: "true"
    volumes:
      - bakery-forgejo-data:/var/lib/gitea
      - bakery-forgejo-config:/etc/gitea

  # S3 stand-in for Backups (task s3:up, task api:test:s3, task
  # backups:test). Its S3 API listens on 127.0.0.1:4960; the API reaches it
  # there in development, as a server reaches a bucket on the internet.
  garage:
    image: docker.io/dxflrs/garage:v2.1.0
    profiles: [s3]
    ports:
      - "127.0.0.1:4960:3900"
    volumes:
      - ./garage/garage.toml:/etc/garage.toml:ro,Z
      - bakery-garage-meta:/var/lib/garage/meta
      - bakery-garage-data:/var/lib/garage/data

volumes:
  bakery-db:
  bakery-forgejo-data:
  bakery-forgejo-config:
  bakery-garage-meta:
  bakery-garage-data:
