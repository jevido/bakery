<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#18181b" />
    <title>The Bakery</title>
    <script>
      // Applies the theme before first paint, the same rule as
      // @bakery/ui/theme, which takes over later (as in apps/web).
      ;(function () {
        var theme = localStorage.getItem('theme')
        var dark = theme !== 'light' && (theme !== 'system' || matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.toggle('dark', dark)
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light'
        document.querySelector('meta[name=theme-color]').setAttribute('content', dark ? '#18181b' : '#ffffff')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
