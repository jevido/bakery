version: "3"

tasks:
  install:
    desc: Install dependencies (the root Bun workspace)
    cmds:
      - task: :install

  dev:
    desc: Run the dashboard on 127.0.0.1:4930 (proxies /api to :4910)
    deps: [install]
    cmds:
      - bun run dev

  walk:
    desc: Open every route in headless Chromium at both sizes and themes (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/walk.ts

  rail:
    desc: Check the guild rail in headless Chromium (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/rail.ts

  servers:
    desc: Check the Servers flows in headless Chromium (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/servers.ts

  settings:
    desc: Check the settings flows (Notifications, Keys & Tokens, Profile, Settings) in headless Chromium (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/settings.ts

  work:
    desc: Check the work pages (Goals, Issues, the Issue page, a Viewer, a hidden Project) in headless Chromium (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/work.ts

  agents:
    desc: Check the Agents pages (the list, Hire agent and its Approval, the Org chart, the Agent page, a Viewer, the Hirer hierarchy) in headless Chromium (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/agents.ts

  costs:
    desc: Check Costs and Budgets and the Costs page against Runs a headless Desktop runner finishes with the claude stand-in (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/costs.ts

  routines:
    desc: Check the Routines pages (Create routine with a schedule, Run now, Recent Runs, a viewer) in headless Chromium (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/routines.ts

  desktop:
    desc: Check the Desktop app's sign-in (approve, cancel, expired) and the Desktops page in headless Chromium (needs task dev)
    deps: [install]
    cmds:
      - bun e2e/desktop.ts

  check:
    desc: svelte-check, tsc, the unit tests and a production build
    deps: [install]
    cmds:
      - bun run check
      - bun test src
      - bun run build
